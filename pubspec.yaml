name: asianfxapp
description: "FXAsianApp – Professional Trading Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Networking ────────────────────────────────────────────────────────────────
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.0.5

  # ── Security / Auth ───────────────────────────────────────────────────────────
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.3

  # ── Firebase ──────────────────────────────────────────────────────────────────
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5

  # ── Local Storage / Cache ─────────────────────────────────────────────────────
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # ── Charts ────────────────────────────────────────────────────────────────────
  fl_chart: ^0.69.0
  candlesticks: ^2.1.0

  # ── UI / Widgets ──────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  pinput: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1
  percent_indicator: ^4.2.3
  badges: ^3.1.2
  pull_to_refresh: ^2.0.0
  infinite_scroll_pagination: ^4.0.0
  dropdown_button2: ^2.3.9
  numberpicker: ^2.1.2
  table_calendar: ^3.1.2

  # ── Internationalization ──────────────────────────────────────────────────────
  intl: ^0.19.0
  timeago: ^3.7.0

  # ── Media / Files ─────────────────────────────────────────────────────────────
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

  # ── Serialization ─────────────────────────────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Utilities ─────────────────────────────────────────────────────────────────
  uuid: ^4.5.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.4.0
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
