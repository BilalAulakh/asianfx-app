name: asianfxapp
description: "FXAsianApp – Professional Trading Platform"
publish_to: 'none'
version: 1.0.21+22

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ─────────────────────────────────────────────────────────
  flutter_bloc: ^9.1.1

  # ── Navigation ────────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Networking ────────────────────────────────────────────────────────────────
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.0.5

  # ── Security / Auth ───────────────────────────────────────────────────────────
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  crypto: ^3.0.3

  # ── Local Storage ─────────────────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── UI / Media ────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  smooth_page_indicator: ^1.2.0+3
  url_launcher: ^6.3.1
  path_provider: ^2.1.4

  # ── Utilities ─────────────────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.0
  equatable: ^2.0.5
  package_info_plus: ^8.0.2
  decimal: ^3.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - shorebird.yaml
